<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة كلية الإعلام - جامعة الأزهر</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="login-container">
        <!-- شعار الكلية المصاحب للصورة -->
        <img src="image.png" alt="شعار كلية الإعلام جامعة الأزهر" class="header-img">[span_0](start_span)[span_0](end_span)
        
        <h2>بوابة كلية الإعلام - جامعة الأزهر</h2>
        
        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('student')">دخول الطلاب</button>
            <button class="tab-btn" onclick="switchTab('admin')">الإدارة</button>
        </div>

        <!-- نموذج دخول الطالب -->
        <form id="studentLoginForm" onsubmit="handleStudentLogin(event)">
            <input type="text" id="studentCode" placeholder="كود الطالب" required>
            <input type="password" id="studentPass" placeholder="كلمة المرور" required>
            <button type="submit">تسجيل الدخول</button>
        </form>

        <!-- نموذج دخول الأدمن -->
        <form id="adminLoginForm" style="display:none;" onsubmit="handleAdminLogin(event)">
            <input type="password" id="adminPass" placeholder="كلمة مرور الإدارة (44554455)" required>
            <button type="submit">دخول لوحة التحكم</button>
        </form>
    </div>

    <!-- التوقيع في أسفل الصفحة -->
    <footer>
        <p>تم التنفيذ والتطوير بواسطة كل من</p>
        <p class="developers"><strong>(أحمد سمير)</strong> | <strong>(عمار منصور)</strong></p>
    </footer>

    <script src="app.js"></script>
</body>
</html>
