<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة التعليم الإلكترونية لكلية الإعلام جامعة الأزهر</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div style="flex:1;">
        <div class="login-wrapper">
            <!-- العنوان النصي المطلوب بدون صورة -->
            <div class="login-title-box">
                <h2>منصة التعليم الإلكترونية لكلية الإعلام</h2>
                <p>جامعة الأزهر الشريف</p>
            </div>
            
            <div class="tabs">
                <button class="tab-btn active" onclick="switchTab('student')">دخول الطالب</button>
                <button class="tab-btn" onclick="switchTab('admin')">الإدارة</button>
            </div>

            <!-- نموذج دخول الطالب -->
            <form id="studentLoginForm" onsubmit="handleStudentLogin(event)">
                <input type="text" id="studentCode" placeholder="كود الطالب الجامعي" required>
                <input type="password" id="studentPass" placeholder="كلمة المرور" required>
                <button type="submit">تسجيل الدخول</button>
            </form>

            <!-- نموذج دخول الأدمن -->
            <form id="adminLoginForm" style="display:none;" onsubmit="handleAdminLogin(event)">
                <input type="password" id="adminPass" placeholder="كلمة مرور الإدارة السرية" required>
                <button type="submit">دخول لوحة التحكم</button>
            </form>
        </div>
    </div>

    <footer>
        <p>تم التنفيذ والتطوير بواسطة:</p>
        <p class="developers">(أحمد سمير) &nbsp;|&nbsp; (عمار منصور)</p>
    </footer>

    <script src="app.js"></script>
</body>
</html>
